server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    charset utf-8;
    index so-tay-pickleball.html;

    gzip on;
    gzip_types text/html text/css application/javascript;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /so-tay-pickleball.html;
        add_header Cache-Control "no-cache";
    }
}
